<script>
(() => {
  const b64 = document.getElementById('p').textContent.trim();
  const raw = Uint8Array.from(atob(b64), (ch) => ch.charCodeAt(0));
  const salt = raw.slice(0, 16), iv = raw.slice(16, 28), data = raw.slice(28);
  const err = document.getElementById('err');
  const btn = document.querySelector('button');
  document.getElementById('f').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    btn.disabled = true; err.textContent = '';
    try {
      const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(document.getElementById('pw').value), 'PBKDF2', false, ['deriveKey']);
      const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: 250000, hash: 'SHA-256' },
        km, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
      const clear = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, data);
      const html = new TextDecoder().decode(clear);
      document.open(); document.write(html); document.close();
    } catch (e) {
      err.textContent = 'Phrase de passe incorrecte.';
      btn.disabled = false;
    }
  });
})();
</script>
